name: ci

on:
  push:
  pull_request:
  schedule:
    # Nightly extended gate (Golden + Acceptance + Performance), 02:30 UTC.
    - cron: "30 2 * * *"
  workflow_dispatch:

jobs:
  # PR fast gate: Bucket=Fast + Integration only (tests/README.md §2).
  # No full battles: PR feedback must stay in minutes, not hours.
  pr-fast-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Build
        run: dotnet build NavyThunder.slnx -c Release
      - name: Fast tests (unit/mechanism, seconds)
        run: >-
          dotnet test tests/NavyThunder.Core.Tests -c Release --no-build
          --filter "Bucket=Fast"
      - name: Integration tests (short real battles <= 300 s sim)
        run: >-
          dotnet test tests/NavyThunder.Core.Tests -c Release --no-build
          --filter "Bucket=Integration"
      - name: Data schema validation (full dataset load)
        run: dotnet run --project src/NavyThunder.ProtectionAnalysis -c Release -- summary
      - name: Calibration gate (stat-card regression)
        run: dotnet run --project src/NavyThunder.ProtectionAnalysis -c Release -- report

  # R1.6 gate: the heaviest supported engagement must simulate >= 1x real time.
  performance-budget-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Build
        run: dotnet build NavyThunder.slnx -c Release
      - name: Performance budget gate (6v6 >= 1x realtime, fragment burst bounded)
        run: >-
          dotnet test tests/NavyThunder.Core.Tests -c Release --no-build
          --filter "FullyQualifiedName~PerformanceBudget"

  # W4.3 gate: the deterministic bb_duel fingerprint must match the committed golden.
  golden-file-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Build
        run: dotnet build NavyThunder.slnx -c Release
      - name: Golden-file fingerprint gate (bb_duel battle summary)
        run: >-
          dotnet test tests/NavyThunder.Core.Tests -c Release --no-build
          --filter "FullyQualifiedName~GoldenFile"

  # Nightly extended gate: full-battle determinism reference + behavior acceptance.
  nightly-extended-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Build
        run: dotnet build NavyThunder.slnx -c Release
      - name: Golden (full 3600 s bb_duel vs committed summary)
        run: >-
          dotnet test tests/NavyThunder.Core.Tests -c Release --no-build
          --filter "Bucket=Golden"
      - name: Acceptance (AI fleet battles + r1 full chain)
        run: >-
          dotnet test tests/NavyThunder.Core.Tests -c Release --no-build
          --filter "Bucket=Acceptance"
      - name: Performance budget gate
        run: >-
          dotnet test tests/NavyThunder.Core.Tests -c Release --no-build
          --filter "Bucket=Performance"

  # Release gate: everything, including Soak and the Godot headless smoke.
  release-full-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Build
        run: dotnet build NavyThunder.slnx -c Release
      - name: Full test suite (all buckets, incl. Soak)
        run: dotnet test tests/NavyThunder.Core.Tests -c Release --no-build
